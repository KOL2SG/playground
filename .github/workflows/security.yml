name: Security
on:
  push:
    branches: [main, test]
  pull_request:
permissions:
  contents: read
  security-events: write        # push: upload SARIF to code scanning
  pull-requests: write          # PRs: post the sticky diff comment
  issues: write
jobs:
  draugr:
    runs-on: [self-hosted, Linux, X64, qwen3-coder]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # diff mode needs the PR's base commit
      - run: draugr scan draugr.saga.yaml -o draugr-out
        continue-on-error: true  # <--- Forces the workflow to keep going
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: draugr-out/results.sarif # Path to the generated SARIF file

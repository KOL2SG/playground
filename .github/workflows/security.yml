name: Security
on:
  push:
    branches: [main, test]
  pull_request:
permissions:
  actions: read
  contents: read
  security-events: write        # push: upload SARIF to code scanning
  pull-requests: write          # PRs: post the sticky diff comment
  issues: write
jobs:
  draugr:
    runs-on: [self-hosted, Linux, X64, qwen3-coder]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # diff mode needs the PR's base commit
      - run: draugr scan draugr.saga.yaml -o draugr-out
        continue-on-error: true  # <--- Forces the workflow to keep going
      # - uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: draugr-out/results.sarif # Path to the generated SARIF file
      # - uses: draugr-dev/draugr@v0   # latest v0.x; pin @vX.Y.Z for reproducible CI (installs Draugr for you)
      #   with:
      #     saga: draugr.saga.yaml
      #     tools: true             # provision the scanners the controls need
      #     # fail-on: P1           # (scan/push) gate the build; the default
      #     # fail-on-new: P1       # (diff/PR)   gate only on findings this PR introduces
      #     # diff-view: actions    # (diff/PR)   the comment lists what to do, not every finding
#       - uses: actions/github-script@v7
#         with:
#           script: |
#             github.rest.issues.create({
#               owner: context.repo.owner,
#               repo: context.repo.repo,
#               title: 'Workflow Alert: Automated Scan Findings',
#               body: `### Workflow Execution Details
#               - **Triggered By:** ${context.actor}
#               - **Commit:** ${context.sha}
#               - **Status:** Action completed with findings.
#
#               ### Summary of Findings
#               ${process.env.FINDINGS_SUMMARY}`
#             })

      # 2. Parse the Draugr SARIF output file using a Python extractor
      - name: Parse Draugr SARIF Findings
        id: parse_sarif
        shell: python
        run: |
          import json
          import os

          # Dynamically fetch the SARIF output path exposed by the Draugr Action step
          sarif_path = "draugr-out/"

          # Fallback check in case the file location is empty or missing
          if not sarif_path or not os.path.exists(sarif_path):
              print(f"SARIF file not found at: {sarif_path}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as env:
                  env.write("has_findings=false\n")
              exit(0)

          with open(sarif_path, "r") as f:
              data = json.load(f)

          findings = []
          # Map structural SARIF arrays compiled by Draugr
          for run in data.get("runs", []):
              tool_driver = run.get("tool", {}).get("driver", {})
              tool_name = tool_driver.get("name", "Draugr Engine")

              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "UnknownRule")
                  msg = result.get("message", {}).get("text", "No details provided.")
                  level = result.get("level", "warning").upper()

                  # Extract the precise code location mapping
                  loc = "Global Scope / Unknown Line"
                  if result.get("locations"):
                      phys = result["locations"][0].get("physicalLocation", {})
                      uri = phys.get("artifactLocation", {}).get("uri", "unknown_file")
                      line = phys.get("region", {}).get("startLine", "?")
                      loc = f"`{uri}` at line `{line}`"

                  # Build a clean Markdown block for the issue text body
                  findings.append(f"### 🛑 [{level}] Rule: {rule_id}\n- **Sub-Scanner Engine:** {tool_name}\n- **Location:** {loc}\n- **Vulnerability Details:** {msg}\n\n---")

          # Compile the runtime parameters and flags
          if findings:
              issue_body = "## ⚠️ Draugr Security Scan Report\nThe automated scan completed with outstanding code vulnerabilities:\n\n" + "\n".join(findings)
              has_findings = "true"
          else:
              issue_body = "🎉 Great news! The Draugr security gate completed with zero vulnerabilities found."
              has_findings = "false"

          # Export tracking parameters to GitHub multi-line ecosystem variables safely
          with open(os.environ['GITHUB_OUTPUT'], 'a') as env:
              env.write(f"has_findings={has_findings}\n")

          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write("DRAUGR_ISSUE_BODY<<EOF\n")
              env.write(issue_body + "\n")
              env.write("EOF\n")

      # 3. Create the issue via GitHub CLI with auto-generated security label handling
      - name: Create GitHub Issue with Findings
        if: steps.parse_sarif.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Automatically generate the security label tag if it does not exist in the repo
          gh label create security --color "d93f0b" --description "Vulnerabilities detected by Draugr security scanner" || true

          # Post the issue thread using the environment strings

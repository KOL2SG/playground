name: Security
on:
  push:
    branches: [main, test]
  pull_request:
permissions:
  actions: read
  contents: read
  security-events: write        # push: upload SARIF to code scanning
  pull-requests: write          # PRs: post the sticky diff comment
  issues: write
jobs:
  draugr:
    runs-on: [self-hosted, Linux, X64, qwen3-coder]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # diff mode needs the PR's base commit
      - run: script -q -c "draugr scan draugr.saga.yaml" draugr_results.txt
        continue-on-error: true  # <--- Forces the workflow to keep going
      # - uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: draugr-out/results.sarif # Path to the generated SARIF file
      # - uses: draugr-dev/draugr@v0   # latest v0.x; pin @vX.Y.Z for reproducible CI (installs Draugr for you)
      #   with:
      #     saga: draugr.saga.yaml
      #     tools: true             # provision the scanners the controls need
      #     # fail-on: P1           # (scan/push) gate the build; the default
      #     # fail-on-new: P1       # (diff/PR)   gate only on findings this PR introduces
      #     # diff-view: actions    # (diff/PR)   the comment lists what to do, not every finding
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the text file from the runner workspace
            const filePath = 'draugr_results.txt';
            const fileContent = fs.readFileSync(filePath, 'utf8');

            // Example 1: Split file into lines and filter specific lines
            const lines = fileContent.split(/\r?\n/);
            const errorLines = lines.filter(line => line.includes('ERROR'));

            // Example 2: Extract specific metrics using Regular Expressions
            const scoreMatch = fileContent.match(/Score:\s*(\d+)/);
            const score = scoreMatch ? scoreMatch[1] : 'N/A';

            // Build the GitHub Issue body
            const issueBody = `
            ### 📄 Text File Analysis Report

            * **Total Lines Processed:** ${lines.length}
            * **Extracted Score:** ${score}
            * **Errors Found:** ${errorLines.length}

            #### 🔍 Error Details:
            \`\`\`text
            ${errorLines.length > 0 ? errorLines.join('\n') : 'No errors found!'}
            \`\`\`

            #### 📜 Full Raw Output:
            <details>
            <summary>Click to expand</summary>

            \`\`\`text
            ${fileContent}
            \`\`\`
            </details>
            `;

            // Create the issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Parsed Report - Score: ${score}`,
              body: issueBody,
              labels: ['parsed-report']
            });

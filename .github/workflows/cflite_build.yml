name: ClusterFuzzLite continuous builds
# ClusterFuzzLite build. Single unified libFuzzer harness under src/cpp/fuzz_targets/all_targets_fuzz.cpp (selector-byte dispatcher). Action builds one binary: $OUT/all_targets.
on:
  push:
    branches:
      - main  # Use your actual default branch here.
permissions: read-all
jobs:
  Build:
   # runs-on: ubuntu-latest
   runs-on: [self-hosted, Linux, X64, qwen3-coder]
   concurrency:
     group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
     cancel-in-progress: true
   strategy:
     fail-fast: false
     matrix:
        sanitizer:
        - address
        # Override this with the sanitizers you want.
        - undefined
        - memory
   steps:
    - name: Clear specific path
      uses: KOL2SG/action-clean@master
      with:
        path: out/artifacts

    - name: Build Fuzzers (${{ matrix.sanitizer }})
      id: build
      uses: KOL2SG/clusterfuzzlite/actions/build_fuzzers@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        language: c++ # Change this to the language you are fuzzing.
        sanitizer: ${{ matrix.sanitizer }}
        upload-build: true
    - name: Upload ClusterFuzzLite SARIF to code scanning
      if: always()
      uses: KOL2SG/codeql-action/upload-sarif@main
      with:
        # SARIF file produced by the ClusterFuzzLite run, relative to the
        # repo root. Trailing **/ imports any *.sarif generated by the run.
        sarif_file: '**/*.sarif'
        # Category separates this analysis from other code-scanning uploads.
        category: clusterfuzzlite-cpp

# yaml-language-server: $schema=https://draugr.dev/schema/v0.155.1/draugr.saga.schema.json
# Generated by `draugr init`. Edit to taste, then: draugr scan draugr.saga.yaml
project: playground
config:
  reachability:
    analyzers: [govulncheck]   # ranks a Go finding down when no code calls it · GO/go.mod · actions-runner/_review/playground/playground/GO/go.mod · actions-runner/_work/playground/playground/GO/go.mod
  controls:
    sca:
      enabled: true       # dependency vulnerabilities (Trivy)
    secrets:
      enabled: true       # leaked credentials (Gitleaks)
    sast:
      enabled: true       # code security (Semgrep)
      gosec:
        enabled: true     # Go-specific checks · GO/go.mod · actions-runner/_review/playground/playground/GO/go.mod · actions-runner/_work/playground/playground/GO/go.mod
    iac:
      enabled: true       # IaC misconfiguration (Trivy config) · actions-runner/_review/_actions/actions/checkout/v4/images/test-ubuntu-git.Dockerfile · actions-runner/_work/_actions/actions/checkout/v4/images/test-ubuntu-git.Dockerfile
    # images:
    #   enabled: true     # container CVEs (Trivy). Add your built image below
components:
  - name: playground
    repositories:
      - url: .
    # Directories with their own dependency files: GO · actions-runner/_review/_actions/actions/checkout/v4 · actions-runner/_review/playground/playground/GO · +2
